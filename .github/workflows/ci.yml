name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: App (typecheck, tests, web bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Bundling for web is the cheapest way to catch an import that only
      # breaks at runtime; it exercises every route file.
      - run: npx expo export --platform web --output-dir .web-build

  gateway:
    name: Gateway (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
